name: Continuous Integration

on:
  push:
    branches:
      - "**"
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: biblioteca
          POSTGRES_USER: biblioteca
          POSTGRES_PASSWORD: biblioteca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biblioteca -d biblioteca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret
      POSTGRES_DB: biblioteca
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: biblioteca
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install -r requirements/dev.txt
          npm ci

      - name: Frontend build
        run: |
          npm run check:frontend
          git diff --exit-code -- backend/static/dist backend/static/vendor

      - name: Django checks
        run: cd backend && python manage.py check

      - name: Migration drift
        run: cd backend && python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: cd backend && python manage.py migrate --noinput

      - name: Tests
        run: cd backend && python manage.py test

      - name: OpenAPI validation
        run: cd backend && python manage.py spectacular --file /tmp/schema.yml --validate --fail-on-warn

      - name: Ruff
        run: ruff check backend

      - name: Format check
        run: ruff format --check backend

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag estagio-ci:${GITHUB_SHA} .

  frontend-e2e:
    name: Frontend end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: biblioteca
          POSTGRES_USER: biblioteca
          POSTGRES_PASSWORD: biblioteca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biblioteca -d biblioteca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret
      POSTGRES_DB: biblioteca
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: biblioteca
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install application dependencies
        run: |
          python -m pip install -r requirements/dev.txt
          npm ci
          npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Prepare database
        run: |
          cd backend
          python manage.py migrate --noinput
          python manage.py seed_demo_data

      - name: Start Django server
        run: |
          cd backend
          python manage.py runserver 127.0.0.1:8000 --noreload --insecure > /tmp/frontend-django.log 2>&1 &
          echo $! > /tmp/frontend-django.pid
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:8000/ > /dev/null

      - name: Run browser smoke flow
        run: npm run test:e2e

      - name: Stop Django server
        if: always()
        run: kill "$(cat /tmp/frontend-django.pid)" 2>/dev/null || true
