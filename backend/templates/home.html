<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sala de Informática — Ambiente de demonstração</title>
  <style>
    :root { font-family: system-ui, sans-serif; color-scheme: light dark; }
    body { max-width: 760px; margin: 0 auto; padding: 2rem 1rem; }
    .warning { border: 1px solid #b7791f; padding: 1rem; border-radius: .5rem; margin-bottom: 1.5rem; }
    #room-notices:empty { display: none; }
    .room-notice { border: 1px solid #2b6cb0; padding: 1rem; border-radius: .5rem; margin-bottom: 1rem; }
    .room-notice h2 { margin-top: 0; }
    .profiles { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    button { padding: .8rem; cursor: pointer; }
    code { word-break: break-word; }
  </style>
</head>
<body>
  <h1>Sala de Informática da Biblioteca da UFAC</h1>
  <div class="warning" role="alert">
    Este ambiente usa autorização simulada. Não há autenticação nem identidade real.
  </div>
  <section
    id="room-notices"
    aria-live="polite"
    aria-label="Avisos da Sala de Informática"></section>
  <h2>Escolha o perfil de teste</h2>
  <div id="profiles" class="profiles"></div>
  <form id="room-user-form" hidden>
    <p>Dados fictícios para demonstração.</p>
    <p><label>Referência <input id="user-reference" name="user_reference" required maxlength="100"></label></p>
    <p><label>Vínculo
      <select id="affiliation-type" name="affiliation_type" required>
        <option value="">Selecione</option>
        <option value="STUDENT">Aluno</option>
        <option value="PROFESSOR">Professor</option>
        <option value="TECHNICAL_STAFF">Técnico-administrativo</option>
      </select>
    </label></p>
    <p><label>Unidade institucional <input id="institutional-unit" name="institutional_unit" required maxlength="255"></label></p>
    <button type="submit">Selecionar Usuário da Sala</button>
  </form>
  <p>Perfil atual: <strong id="current-profile">nenhum</strong></p>
  <p>Referência atual: <strong id="current-reference">nenhuma</strong></p>
  <p><a href="/api/docs/">Documentação interativa da API</a></p>

  <script>
    async function loadRoomNotices() {
      const response = await fetch('/api/v1/room-notices/active/');
      if (!response.ok) return;
      const notices = await response.json();
      const root = document.getElementById('room-notices');
      root.replaceChildren();
      for (const notice of notices) {
        const article = document.createElement('article');
        article.className = 'room-notice';
        article.setAttribute(
          'role',
          notice.notice_type === 'CLOSURE' ? 'alert' : 'status'
        );
        const title = document.createElement('h2');
        title.textContent = notice.title;
        const message = document.createElement('p');
        message.textContent = notice.message;
        article.append(title, message);
        root.appendChild(article);
      }
    }

    async function loadContext() {
      const response = await fetch('/api/v1/demo/context/');
      const context = await response.json();
      document.getElementById('current-profile').textContent = context.profile || 'nenhum';
      document.getElementById('current-reference').textContent = context.user_reference || 'nenhuma';
      const root = document.getElementById('profiles');
      root.innerHTML = '';
      for (const item of context.available_profiles) {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = item.label;
        button.addEventListener('click', () => {
          document.getElementById('room-user-form').hidden = item.value !== 'ROOM_USER';
          if (item.value !== 'ROOM_USER') selectProfile(item.value);
        });
        root.appendChild(button);
      }
    }

    async function selectProfile(profile, identity = {}) {
      const response = await fetch('/api/v1/demo/select-profile/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({profile, ...identity})
      });
      if (!response.ok) {
        alert('Não foi possível selecionar o perfil.');
        return;
      }
      await loadContext();
    }

    document.getElementById('room-user-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      selectProfile('ROOM_USER', Object.fromEntries(form.entries()));
    });

    loadRoomNotices();
    loadContext();
  </script>
</body>
</html>
