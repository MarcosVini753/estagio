{% if page_obj.paginator.num_pages > 1 %}
  <nav class="pagination" aria-label="Paginação">
    {% if page_obj.has_previous %}
      <a href="{% querystring page=page_obj.previous_page_number %}"{% if pagination_target %} hx-get="{% querystring page=page_obj.previous_page_number %}" hx-target="{{ pagination_target }}" hx-swap="outerHTML" hx-push-url="true"{% endif %}>Anterior</a>
    {% else %}
      <span aria-disabled="true">Anterior</span>
    {% endif %}
    <span aria-current="page">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a href="{% querystring page=page_obj.next_page_number %}"{% if pagination_target %} hx-get="{% querystring page=page_obj.next_page_number %}" hx-target="{{ pagination_target }}" hx-swap="outerHTML" hx-push-url="true"{% endif %}>Próxima</a>
    {% else %}
      <span aria-disabled="true">Próxima</span>
    {% endif %}
  </nav>
{% endif %}
